<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8ef">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>妈妈，40 岁生日快乐</title>
<style>
  :root{
    --cream:#fff8ef;
    --cream-2:#fbeedd;
    --gold:#c9a227;
    --gold-light:#e8c56a;
    --gold-deep:#9c7a1e;
    --rose:#e8b4b8;
    --blush:#f6d9d6;
    --ink:#4a3b32;
    --ink-soft:#7c6a5e;
    --serif:"Songti SC","STSong","Kaiti SC","KaiTi","Noto Serif SC",serif;
    --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #fffaf3 0%, var(--cream) 45%, var(--cream-2) 100%);
    color:var(--ink);
    font-family:var(--sans);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body.locked{overflow:hidden;}

  /* ---------- 画布层 ---------- */
  #sky,#confetti{
    position:fixed;inset:0;width:100%;height:100%;
    pointer-events:none;z-index:2;
  }
  #confetti{z-index:60;}

  /* ---------- 音乐按钮 ---------- */
  #musicBtn{
    position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:80;
    width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(201,162,39,.45);
    background:rgba(255,250,243,.72);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    color:var(--gold-deep);font-size:19px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transform:scale(.85);transition:.45s ease;
    cursor:pointer;padding:0;pointer-events:none;
  }
  #musicBtn.show{opacity:1;transform:scale(1);pointer-events:auto;}
  #musicBtn.on{color:#fff;background:linear-gradient(140deg,var(--gold-light),var(--gold));border-color:transparent;box-shadow:0 6px 18px rgba(201,162,39,.35);}
  #musicBtn .eq{display:none;gap:2px;align-items:flex-end;height:14px;}
  #musicBtn.on .eq{display:flex;}
  #musicBtn.on .note{display:none;}
  #musicBtn .eq i{display:block;width:2.5px;background:#fff;border-radius:2px;animation:eq 1s ease-in-out infinite;}
  #musicBtn .eq i:nth-child(1){height:6px;animation-delay:0s;}
  #musicBtn .eq i:nth-child(2){height:12px;animation-delay:.18s;}
  #musicBtn .eq i:nth-child(3){height:8px;animation-delay:.36s;}
  @keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}

  /* ---------- 封面 ---------- */
  .hero{
    position:relative;z-index:3;
    min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 26px;text-align:center;overflow:hidden;
  }
  .glow{
    position:absolute;width:min(150vw,760px);height:min(150vw,760px);
    left:50%;top:44%;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(232,197,106,.30) 0%,rgba(232,180,184,.16) 38%,rgba(255,248,239,0) 68%);
    animation:breathe 7s ease-in-out infinite;pointer-events:none;
  }
  @keyframes breathe{
    0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.85}
    50%{transform:translate(-50%,-50%) scale(1.12);opacity:1}
  }
  .hero-inner{position:relative;z-index:4;}
  .eyebrow{
    font-size:11px;letter-spacing:.42em;color:var(--gold-deep);
    opacity:.85;margin-bottom:26px;text-indent:.42em;
  }
  .title{font-family:var(--serif);margin:0;font-weight:400;line-height:1.12;}
  .title .line1{
    display:block;font-size:clamp(30px,9.2vw,44px);letter-spacing:.32em;
    text-indent:.32em;color:var(--ink);
  }
  .title .num{
    display:block;font-size:clamp(96px,31vw,150px);font-weight:600;
    letter-spacing:.02em;line-height:1;
    background:linear-gradient(160deg,#f0d8a0 0%,var(--gold-light) 26%,var(--gold) 52%,#b98f1e 74%,#f3ddab 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 20px rgba(201,162,39,.32));
    animation:shine 5s ease-in-out infinite;background-size:200% 200%;
    margin:6px 0 4px;
  }
  @keyframes shine{
    0%,100%{background-position:0% 50%}
    50%{background-position:100% 50%}
  }
  .title .line2{
    display:block;font-size:clamp(22px,6.6vw,30px);letter-spacing:.3em;
    text-indent:.3em;color:var(--ink);
  }
  .sub{
    margin:22px 0 0;font-size:13.5px;letter-spacing:.1em;
    color:var(--ink-soft);line-height:1.9;
  }
  .start{
    margin-top:44px;padding:14px 34px;border-radius:100px;
    border:1px solid rgba(201,162,39,.55);
    background:rgba(255,255,255,.55);
    color:var(--gold-deep);font-size:13.5px;letter-spacing:.2em;text-indent:.2em;
    font-family:var(--sans);cursor:pointer;
    box-shadow:0 10px 30px rgba(201,162,39,.14), inset 0 0 0 3px rgba(255,255,255,.55);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 10px 30px rgba(201,162,39,.14), inset 0 0 0 3px rgba(255,255,255,.55)}
    50%{box-shadow:0 10px 44px rgba(201,162,39,.34), inset 0 0 0 3px rgba(255,255,255,.8)}
  }
  .start:active{transform:scale(.97);}
  /* ---------- 内容块 ---------- */
  main{position:relative;z-index:3;padding-bottom:40px;}
  .block{
    max-width:560px;margin:0 auto;padding:64px 26px;
    opacity:0;transform:translateY(34px);
    transition:opacity 1.1s cubic-bezier(.2,.7,.3,1),transform 1.1s cubic-bezier(.2,.7,.3,1);
  }
  .block.in{opacity:1;transform:none;}
  .kicker{
    display:flex;align-items:center;gap:12px;justify-content:center;
    font-size:11.5px;letter-spacing:.3em;color:var(--gold-deep);
    margin:0 0 30px;text-indent:.3em;
  }
  .kicker::before,.kicker::after{
    content:"";height:1px;width:30px;
    background:linear-gradient(90deg,transparent,rgba(201,162,39,.6));
  }
  .kicker::after{background:linear-gradient(270deg,transparent,rgba(201,162,39,.6));}

  /* 打字机 */
  .type{font-family:var(--serif);font-size:17px;line-height:2.15;color:var(--ink);min-height:150px;text-align:center;}
  .type p{margin:0 0 2px;}
  .caret{display:inline-block;width:1px;height:1.05em;background:var(--gold);vertical-align:-.16em;animation:blink .9s steps(1) infinite;}
  @keyframes blink{50%{opacity:0}}

  /* ---------- 蛋糕 ---------- */
  .cake-block{text-align:center;}
  .cake-wrap{position:relative;display:inline-block;padding-top:50px;}
  .candles{display:flex;justify-content:center;gap:26px;height:58px;align-items:flex-end;}
  .candle{position:relative;width:9px;cursor:pointer;}
  .candle .body{
    width:9px;height:34px;border-radius:3px;
    background:repeating-linear-gradient(180deg,#e8b4b8 0 6px,#fff2ee 6px 12px);
    box-shadow:inset -2px 0 0 rgba(0,0,0,.06);
  }
  .candle .flame{
    position:absolute;left:50%;top:-19px;width:13px;height:19px;
    transform:translateX(-50%);
    background:radial-gradient(circle at 50% 74%,#fff8d0 0%,#ffd166 34%,#ff9a3c 66%,rgba(255,120,40,0) 78%);
    border-radius:50% 50% 46% 46%/62% 62% 38% 38%;
    filter:drop-shadow(0 0 9px rgba(255,170,60,.75));
    animation:flicker 1.15s ease-in-out infinite;
    transform-origin:50% 100%;
    transition:opacity .35s,transform .35s;
  }
  .candle:nth-child(2) .flame{animation-delay:.2s}
  .candle:nth-child(3) .flame{animation-delay:.45s}
  .candle:nth-child(4) .flame{animation-delay:.65s}
  @keyframes flicker{
    0%,100%{transform:translateX(-50%) scale(1) rotate(-1.5deg);opacity:1}
    50%{transform:translateX(-50%) scale(1.1,.94) rotate(1.5deg);opacity:.86}
  }
  .candle.out .flame{opacity:0;transform:translateX(-50%) scale(.2);animation:none;}
  .cake{position:relative;width:212px;height:104px;margin:0 auto;}
  .tier-top{
    position:absolute;left:34px;top:0;width:144px;height:46px;border-radius:12px 12px 5px 5px;
    background:linear-gradient(180deg,#fdf3e3,#f4e2c6);
    box-shadow:inset 0 -6px 10px rgba(201,162,39,.12);
  }
  .drip{
    position:absolute;left:24px;top:38px;width:164px;height:26px;
    background:
      radial-gradient(circle at 6% 0,#fdf6ea 44%,transparent 45%),
      radial-gradient(circle at 24% 0,#fdf6ea 44%,transparent 45%),
      radial-gradient(circle at 42% 0,#fdf6ea 44%,transparent 45%),
      radial-gradient(circle at 60% 0,#fdf6ea 44%,transparent 45%),
      radial-gradient(circle at 78% 0,#fdf6ea 44%,transparent 45%),
      radial-gradient(circle at 94% 0,#fdf6ea 44%,transparent 45%),
      linear-gradient(180deg,#fdf6ea,#f8ebd6);
    border-radius:0 0 12px 12px;
    filter:drop-shadow(0 3px 5px rgba(150,105,80,.16));
  }
  .tier-bottom{
    position:absolute;left:8px;top:56px;width:196px;height:46px;border-radius:9px 9px 7px 7px;
    background:linear-gradient(180deg,#f2cfc9,#e5b3ae);
    box-shadow:inset 0 7px 0 rgba(255,255,255,.62), inset 0 -8px 14px rgba(140,70,70,.16);
  }
  .tier-bottom::before{
    content:"";position:absolute;left:14px;right:14px;top:13px;height:22px;opacity:.85;pointer-events:none;
    background-image:
      radial-gradient(circle at 6% 30%,#fff3d6 2.4px,transparent 2.8px),
      radial-gradient(circle at 18% 70%,#f9e0de 2px,transparent 2.4px),
      radial-gradient(circle at 31% 20%,#e8c56a 2.6px,transparent 3px),
      radial-gradient(circle at 44% 62%,#fff3d6 2px,transparent 2.4px),
      radial-gradient(circle at 57% 26%,#f9e0de 2.4px,transparent 2.8px),
      radial-gradient(circle at 69% 68%,#e8c56a 2px,transparent 2.4px),
      radial-gradient(circle at 82% 24%,#fff3d6 2.6px,transparent 3px),
      radial-gradient(circle at 93% 60%,#f9e0de 2px,transparent 2.4px);
  }
  .tier-bottom::after{
    content:"";position:absolute;inset:auto 0 0 0;height:8px;border-radius:0 0 7px 7px;
    background:linear-gradient(180deg,rgba(201,162,39,.18),rgba(201,162,39,.34));
  }
  .plate{
    position:absolute;left:-14px;top:94px;width:240px;height:22px;border-radius:50%;
    background:radial-gradient(ellipse at 50% 30%,#fffdf9,#efe3d2 70%,#e2d2bd);
    box-shadow:0 12px 26px rgba(120,90,50,.18);
  }
  .hint{margin:26px 0 0;font-size:12.5px;letter-spacing:.16em;color:var(--ink-soft);min-height:20px;transition:.4s;}
  .hint.done{color:var(--gold-deep);}

  /* ---------- 照片墙 ---------- */
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
  .frame{
    position:relative;background:#fffdf8;border-radius:4px;padding:9px 9px 30px;
    box-shadow:0 10px 26px rgba(122,95,60,.14),0 1px 0 rgba(255,255,255,.9) inset;
    cursor:pointer;transition:transform .45s cubic-bezier(.2,.7,.3,1),box-shadow .45s;
    opacity:0;transform:translateY(24px);overflow:hidden;
  }
  .frame.in{opacity:1;transform:none;}
  .frame:nth-child(odd){transform:rotate(-1.6deg);}
  .frame:nth-child(even){transform:rotate(1.4deg);}
  .frame.in:nth-child(odd){transform:rotate(-1.6deg);}
  .frame.in:nth-child(even){transform:rotate(1.4deg);}
  .frame:active{transform:scale(.975) rotate(0deg);box-shadow:0 6px 16px rgba(122,95,60,.16);}
  .shot{
    position:relative;width:100%;aspect-ratio:1/1;border-radius:2px;overflow:hidden;
    background:linear-gradient(150deg,#f7ecdd,#f2e2cf);
    display:flex;align-items:center;justify-content:center;
  }
  .shot img{width:100%;height:100%;object-fit:cover;display:block;}
  .ph{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:9px;
    background:
      repeating-linear-gradient(45deg,rgba(201,162,39,.05) 0 10px,rgba(201,162,39,0) 10px 20px),
      linear-gradient(150deg,#f9efe0,#f3e3cd);
  }
  .ph svg{width:24px;height:24px;stroke:var(--gold);opacity:.7;fill:none;stroke-width:1.4;}
  .ph span{font-size:10px;letter-spacing:.12em;color:var(--gold-deep);opacity:.75;}
  .cap{
    position:absolute;left:11px;right:11px;bottom:8px;
    font-family:var(--serif);font-size:11.5px;color:var(--ink-soft);
    text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .frame.wide{grid-column:1 / -1;}
  .frame.wide .shot{aspect-ratio:4/3;}
  .gallery[hidden]{display:none;}

  /* ---------- 照片解锁 ---------- */
  .photo-lock{
    background:linear-gradient(180deg,rgba(255,253,248,.96),rgba(253,246,236,.96));
    border:1px solid rgba(201,162,39,.24);border-radius:16px;
    padding:34px 22px 28px;text-align:center;
    box-shadow:0 16px 40px rgba(140,105,60,.10);
  }
  .photo-lock.unlocked{display:none;}
  .photo-lock .lock-icon{color:var(--gold-deep);opacity:.75;line-height:0;}
  .photo-lock .lock-icon svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.4;}
  .photo-lock h3{
    font-family:var(--serif);font-weight:400;font-size:16px;
    color:var(--ink);margin:12px 0 6px;letter-spacing:.06em;
  }
  .photo-lock .sub2{font-size:12px;color:var(--ink-soft);margin:0 0 20px;letter-spacing:.06em;}
  .photo-lock form{display:flex;gap:8px;max-width:330px;margin:0 auto;}
  .photo-lock input{
    flex:1;min-width:0;padding:12px 14px;border-radius:10px;
    border:1px solid rgba(201,162,39,.35);background:rgba(255,255,255,.7);
    font-family:var(--sans);font-size:14px;color:var(--ink);letter-spacing:.06em;
    outline:none;transition:.3s;
  }
  .photo-lock input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.12);}
  .photo-lock button{
    padding:0 18px;border-radius:10px;border:none;cursor:pointer;
    background:linear-gradient(140deg,var(--gold-light),var(--gold));
    color:#fff;font-family:var(--sans);font-size:13px;letter-spacing:.1em;
    box-shadow:0 6px 16px rgba(201,162,39,.24);
  }
  .photo-lock button:disabled{opacity:.55;cursor:default;}
  .photo-lock .err{min-height:18px;margin:12px 0 0;font-size:12px;color:#b4433f;letter-spacing:.04em;}
  .photo-lock .lock-note{margin:4px 0 0;font-size:10.5px;color:var(--ink-soft);opacity:.7;letter-spacing:.04em;}

  /* ---------- 信 ---------- */
  .card{
    position:relative;background:linear-gradient(180deg,rgba(255,253,248,.96),rgba(253,246,236,.96));
    border:1px solid rgba(201,162,39,.24);border-radius:16px;
    padding:38px 26px 34px;
    box-shadow:0 20px 50px rgba(140,105,60,.12);
  }
  .card::before{
    content:"";position:absolute;inset:7px;border:1px solid rgba(201,162,39,.16);border-radius:11px;pointer-events:none;
  }
  .card p{font-family:var(--serif);font-size:15.5px;line-height:2.2;margin:0 0 14px;color:var(--ink);}
  .card p:last-of-type{margin-bottom:0;}
  .sign{
    display:block;margin-top:22px;text-align:right;font-family:var(--serif);
    font-size:13.5px;color:var(--gold-deep);letter-spacing:.08em;
  }
  footer{
    position:relative;z-index:3;text-align:center;
    padding:20px 26px calc(44px + env(safe-area-inset-bottom));
    font-size:11px;letter-spacing:.22em;color:var(--ink-soft);opacity:.6;
  }

  /* ---------- 灯箱 ---------- */
  .lightbox{
    position:fixed;inset:0;z-index:100;display:none;
    align-items:center;justify-content:center;padding:24px;
    background:rgba(40,30,22,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    opacity:0;transition:opacity .3s;
  }
  .lightbox.show{display:flex;opacity:1;}
  .lightbox img{max-width:100%;max-height:76vh;border-radius:6px;box-shadow:0 30px 70px rgba(0,0,0,.5);animation:pop .38s cubic-bezier(.2,.8,.3,1);}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .lightbox .cap2{
    position:absolute;bottom:calc(34px + env(safe-area-inset-bottom));left:0;right:0;
    text-align:center;font-family:var(--serif);font-size:13px;color:#f6e8d2;letter-spacing:.1em;
  }

  /* ---------- 提示 toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    z-index:120;background:rgba(74,59,50,.92);color:#fff8ef;
    padding:11px 20px;border-radius:100px;font-size:12.5px;letter-spacing:.06em;
    opacity:0;pointer-events:none;transition:.35s;max-width:86vw;text-align:center;line-height:1.6;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
    .block,.frame{opacity:1;transform:none;}
  }
  @media (min-width:520px){
    .gallery{grid-template-columns:repeat(3,1fr);}
    .frame.wide{grid-column:span 2;}
  }
</style>
</head>
<body class="locked">

<canvas id="sky"></canvas>
<canvas id="confetti"></canvas>

<button id="musicBtn" aria-label="音乐开关">
  <span class="note">♪</span>
  <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
</button>

<section class="hero" id="hero">
  <div class="glow"></div>
  <div class="hero-inner">
    <div class="eyebrow">2026 · 11 · 02</div>
    <h1 class="title">
      <span class="line1">妈妈</span>
      <span class="num">40</span>
      <span class="line2">生日快乐</span>
    </h1>
    <p class="sub">四十年，你把日子过成了温柔的样子</p>
    <button class="start" id="startBtn">轻触，开启祝福</button>
  </div>
</section>

<main>
  <section class="block" id="letterBlock">
    <p class="kicker">想对你说</p>
    <div class="type" id="type"></div>
  </section>

  <section class="block cake-block">
    <p class="kicker">许个愿吧</p>
    <div class="cake-wrap">
      <div class="candles" id="candles">
        <div class="candle"><div class="body"></div><div class="flame"></div></div>
        <div class="candle"><div class="body"></div><div class="flame"></div></div>
        <div class="candle"><div class="body"></div><div class="flame"></div></div>
        <div class="candle"><div class="body"></div><div class="flame"></div></div>
      </div>
      <div class="cake">
        <div class="tier-top"></div>
        <div class="tier-bottom"></div>
        <div class="drip"></div>
        <div class="plate"></div>
      </div>
    </div>
    <p class="hint" id="cakeHint">轻触烛火，帮你吹蜡烛</p>
  </section>

  <section class="block">
    <p class="kicker">我们的照片</p>
    <div class="photo-lock" id="photoLock">
      <div class="lock-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
      <h3>这些照片只留给家里人</h3>
      <p class="sub2">输入密码，解锁我们的照片</p>
      <form id="pwForm" autocomplete="off">
        <input id="pwInput" type="password" placeholder="请输入密码" autocomplete="off" aria-label="照片密码">
        <button id="pwBtn" type="submit">解锁</button>
      </form>
      <p class="err" id="pwErr"></p>
      <p class="lock-note">解锁后，这台手机会记住，下次直接查看</p>
    </div>
    <div class="gallery" id="gallery" hidden></div>
  </section>

  <section class="block">
    <p class="kicker">写在最后</p>
    <div class="card" id="letterCard"></div>
  </section>
</main>

<footer>愿你所愿皆成 · 每一天都被好好爱着</footer>

<div class="lightbox" id="lightbox">
  <img id="lightboxImg" alt="">
  <div class="cap2" id="lightboxCap"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==========================================================
   可修改区：把这几个地方改成你自己想说的话即可
   ========================================================== */
const CONFIG = {
  /* 打字机逐句出现的话 */
  lines: [
    "今天，是你四十岁的生日。",
    "好像昨天，你还牵着我的手过马路，",
    "一转眼，我已经能替你挡一挡风了。",
    "这些年，你把难处都悄悄藏起来，",
    "把最好的，都留给了我。"
  ],
  /* 信的内容，每个字符串是一段 */
  letter: [
    "亲爱的妈妈：",

/* ---------------- 天空：金色花瓣 + 星尘 ---------------- */
(function skyCanvas(){
  const cv = $('#sky'), ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1, petals = [], running = false, raf = 0;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);

  function makePetal(init){
    const isSpark = Math.random() < 0.34;
    return {
      x: Math.random() * W,
      y: init ? Math.random() * H : -30 - Math.random() * 120,
      r: isSpark ? 1 + Math.random() * 1.8 : 3.5 + Math.random() * 5,
      vy: isSpark ? 6 + Math.random() * 10 : 14 + Math.random() * 22,
      vx: (Math.random() - 0.5) * 12,
      sway: 18 + Math.random() * 30,
      phase: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 1.2,
      alpha: isSpark ? 0.5 + Math.random() * 0.45 : 0.35 + Math.random() * 0.4,
      hue: Math.random() < 0.55 ? 43 : 352,
      isSpark,
      twinkle: Math.random() * Math.PI * 2
    };
  }

  function drawPetal(p){
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.globalAlpha = p.alpha;
    if (p.isSpark){
      p.twinkle += 0.06;
      const a = p.alpha * (0.55 + 0.45 * Math.sin(p.twinkle));
      ctx.globalAlpha = a;
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, p.r * 4);
      g.addColorStop(0, 'rgba(255,240,200,0.95)');
      g.addColorStop(1, 'rgba(255,220,140,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, p.r * 4, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.rotate(p.rot);
      const grad = ctx.createLinearGradient(-p.r, -p.r, p.r, p.r);
      if (p.hue === 43){
        grad.addColorStop(0, 'rgba(240,214,150,0.95)');
        grad.addColorStop(1, 'rgba(201,162,39,0.55)');
      } else {
        grad.addColorStop(0, 'rgba(246,213,212,0.95)');
        grad.addColorStop(1, 'rgba(226,160,168,0.55)');
      }
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.r, p.r * 0.56, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function loop(t){
    if (!running) return;
    ctx.clearRect(0, 0, W, H);
    const dt = Math.min(0.05, (t - (loop.last || t)) / 1000);
    loop.last = t;
    for (const p of petals){
      p.phase += dt * 0.9;
      p.y += p.vy * dt;
      p.x += (p.vx + Math.cos(p.phase) * p.sway * 0.5) * dt;
      p.rot += p.vrot * dt;
      if (p.y > H + 40 || p.x < -80 || p.x > W + 80){
        Object.assign(p, makePetal(false));
      }
      drawPetal(p);
    }
    raf = requestAnimationFrame(loop);
  }

  window.startSky = function(){
    if (running || REDUCED) return;
    resize();
    petals = Array.from({ length: Math.min(46, Math.round(W / 9)) }, () => makePetal(true));
    running = true;
    raf = requestAnimationFrame(loop);
  };
})();

/* ---------------- 撒花 ---------------- */
const confettiCv = $('#confetti');
const cctx = confettiCv.getContext('2d');
let confetti = [], confettiRaf = 0;
const CONF_COLORS = ['#e8c56a', '#c9a227', '#e8b4b8', '#f6d9d6', '#fff3d6', '#d98c6a'];

function resizeConfetti(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  confettiCv.width = Math.floor(confettiCv.clientWidth * dpr);
  confettiCv.height = Math.floor(confettiCv.clientHeight * dpr);
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resizeConfetti);

function burst(x, y, n = 80){
  if (REDUCED) return;
  resizeConfetti();
  const W = confettiCv.clientWidth, H = confettiCv.clientHeight;
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = 120 + Math.random() * 340;
    confetti.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 140,
      w: 4 + Math.random() * 6,
      h: 6 + Math.random() * 8,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 12,
      color: CONF_COLORS[(Math.random() * CONF_COLORS.length) | 0],
      life: 1,
      round: Math.random() < 0.3
    });
  }
  if (!confettiRaf) confettiRaf = requestAnimationFrame(confettiLoop);
  void W; void H;
}

function confettiLoop(t){
  const W = confettiCv.clientWidth, H = confettiCv.clientHeight;
  const dt = Math.min(0.045, (t - (confettiLoop.last || t)) / 1000);
  confettiLoop.last = t;
  cctx.clearRect(0, 0, W, H);
  for (let i = confetti.length - 1; i >= 0; i--){
    const p = confetti[i];
    p.vy += 720 * dt;
    p.vx *= 0.995;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.vr * dt;
    p.life -= dt * 0.42;
    if (p.life <= 0 || p.y > H + 60){
      confetti.splice(i, 1);
      continue;
    }
    cctx.save();
    cctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    cctx.translate(p.x, p.y);
    cctx.rotate(p.rot);
    cctx.fillStyle = p.color;
    if (p.round){
      cctx.beginPath(); cctx.arc(0, 0, p.w * 0.55, 0, Math.PI * 2); cctx.fill();
    } else {
      cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    }
    cctx.restore();
  }
  if (confetti.length){
    confettiRaf = requestAnimationFrame(confettiLoop);
  } else {
    confettiRaf = 0;
    confettiLoop.last = 0;
  }
}

/* ---------------- 音乐：用 Web Audio 直接合成《生日快乐》 ---------------- */
let actx = null, musicOn = false, musicTimer = null, masterGain = null;

const NOTE = { G4:392.00, A4:440.00, B4:493.88, C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99 };
const MELODY = [
  ['G4',.5],['G4',.5],['A4',1],['G4',1],['C5',1],['B4',1.8],
  ['G4',.5],['G4',.5],['A4',1],['G4',1],['D5',1],['C5',1.8],
  ['G4',.5],['G4',.5],['G5',1],['E5',1],['C5',1],['D5',1],['C5',1.8],
  ['F5',.5],['F5',.5],['E5',1],['C5',1],['D5',1],['C5',2.2]
];
const BEAT = 0.42;

function ensureAudio(){
  if (!actx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    masterGain = actx.createGain();
    masterGain.gain.value = 0.0001;
    masterGain.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

function scheduleMelody(startAt){
  let t = startAt;
  for (const [name, beats] of MELODY){
    const dur = beats * BEAT;
    playTone(NOTE[name], t, dur);
    /* 低八度轻声铺底，声音更暖 */
    playTone(NOTE[name] / 2, t, dur, 0.055, 'sine');
    t += dur;
  }
  return t - startAt;
}

function playTone(freq, when, dur, level = 0.16, type = 'triangle'){
  const osc = actx.createOscillator();
  const g = actx.createGain();
  const lp = actx.createBiquadFilter();
  lp.type = 'lowpass';
  lp.frequency.value = 2600;
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(level, when + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, when + Math.max(0.35, dur * 0.92));
  osc.connect(lp); lp.connect(g); g.connect(masterGain);
  osc.start(when);
  osc.stop(when + dur + 0.6);
}

function startMusic(){
  if (musicOn) return;
  if (!ensureAudio()) return;
  musicOn = true;
  masterGain.gain.cancelScheduledValues(actx.currentTime);
  masterGain.gain.setValueAtTime(0.0001, actx.currentTime);
  masterGain.gain.exponentialRampToValueAtTime(0.5, actx.currentTime + 1.4);
  const len = scheduleMelody(actx.currentTime + 0.15);
  musicTimer = setTimeout(function repeat(){
    if (!musicOn) return;
    const l = scheduleMelody(actx.currentTime + 0.4);
    musicTimer = setTimeout(repeat, l * 1000 + 2600);
  }, len * 1000 + 3000);
  $('#musicBtn').classList.add('on');
}

function stopMusic(){
  musicOn = false;
  clearTimeout(musicTimer);
  if (actx && masterGain){
    masterGain.gain.cancelScheduledValues(actx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, actx.currentTime);
    masterGain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.5);
  }
  $('#musicBtn').classList.remove('on');
}

$('#musicBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  if (musicOn) stopMusic(); else startMusic();
});

/* ---------------- 打字机 ---------------- */
(function typewriter(){
  const el = $('#type');
  let idx = 0, done = false;

  function typeLine(line, cb){
    const p = document.createElement('p');
    const span = document.createElement('span');
    const caret = document.createElement('span');
    caret.className = 'caret';
    p.appendChild(span); p.appendChild(caret);
    el.appendChild(p);
    let i = 0;
    (function step(){
      if (i < line.length){
        span.textContent += line[i++];
        setTimeout(step, 78 + Math.random() * 45);
      } else {
        caret.remove();
        setTimeout(cb, 300);
      }
    })();
  }

  function run(){
    if (idx >= CONFIG.lines.length){ done = true; return; }
    typeLine(CONFIG.lines[idx++], run);
  }

  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if (en.isIntersecting && !done && el.dataset.go !== '1'){
        el.dataset.go = '1';
        setTimeout(run, 320);
        io.disconnect();
      }
    });
  }, { threshold: 0.35 });
  io.observe(el);
})();

/* ---------------- 滚动淡入 ---------------- */
(function reveal(){
  const items = document.querySelectorAll('.block');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if (en.isIntersecting){
        en.target.classList.add('in');
        io.unobserve(en.target);
      }
    });
  }, { threshold: 0.16, rootMargin: '0px 0px -8% 0px' });
  items.forEach(i=>io.observe(i));
})();

/* ---------------- 照片墙（AES-GCM 加密） ---------------- */
const PHOTO_VAULT = CONFIG.photoVault;

function b64ToBytes(s){
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function bytesToB64(bytes){
  let s = '';
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s);
}

function derivePhotoKey(passphrase, extractable){
  const base = crypto.subtle.importKey(
    'raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return base.then(k => crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64ToBytes(PHOTO_VAULT.salt), iterations: PHOTO_VAULT.iterations, hash: 'SHA-256' },
    k, { name: 'AES-GCM', length: 256 }, extractable, ['decrypt']));
}

async function decryptPhoto(key, url){
  const res = await fetch(url);
  if (!res.ok) throw new Error('photo missing');
  const buf = new Uint8Array(await res.arrayBuffer());
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
  return URL.createObjectURL(new Blob([plain], { type: 'image/jpeg' }));
}

function renderGallery(urls){
  const box = $('#gallery');
  box.innerHTML = '';
  CONFIG.photos.forEach((item, i)=>{
    const frame = document.createElement('div');
    frame.className = 'frame' + (item.wide ? ' wide' : '');
    const shot = document.createElement('div');
    shot.className = 'shot';

    const img = new Image();
    img.alt = item.caption || '';
    img.src = urls[i];
    shot.appendChild(img);

    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = item.caption || '';

    frame.appendChild(shot);
    frame.appendChild(cap);
    box.appendChild(frame);

    frame.addEventListener('click', ()=>{
      $('#lightboxImg').src = img.src;
      $('#lightboxCap').textContent = item.caption || '';
      $('#lightbox').classList.add('show');
    });

    const io = new IntersectionObserver((entries)=>{
      entries.forEach(en=>{
        if (en.isIntersecting){
          setTimeout(()=>frame.classList.add('in'), i * 90);
          io.unobserve(frame);
        }
      });
    }, { threshold: 0.2 });
    io.observe(frame);
  });
  box.hidden = false;
}

let photosUnlocked = false;

async function unlockPhotos(key, remember){
  if (photosUnlocked) return;
  const urls = await Promise.all(CONFIG.photos.map(item => decryptPhoto(key, item.enc)));
  renderGallery(urls);
  $('#photoLock').classList.add('unlocked');
  photosUnlocked = true;
  if (remember){
    try {
      const raw = await crypto.subtle.exportKey('raw', key);
      localStorage.setItem(PHOTO_VAULT.storageKey, bytesToB64(new Uint8Array(raw)));
    } catch (e) {}
  }
}

async function trySavedKey(){
  let saved = null;
  try { saved = localStorage.getItem(PHOTO_VAULT.storageKey); } catch (e) {}
  if (!saved) return false;
  try {
    const key = await crypto.subtle.importKey('raw', b64ToBytes(saved), 'AES-GCM', true, ['decrypt']);
    await unlockPhotos(key, false);
    return true;
  } catch (e) {
    try { localStorage.removeItem(PHOTO_VAULT.storageKey); } catch (e2) {}
    return false;
  }
}

$('#pwForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const input = $('#pwInput'), btn = $('#pwBtn'), err = $('#pwErr');
  const pw = input.value.trim();
  if (!pw) return;
  btn.disabled = true;
  err.textContent = '正在解锁…';
  try {
    const key = await derivePhotoKey(pw, true);
    await unlockPhotos(key, true);
    err.textContent = '';
  } catch (e2) {
    err.textContent = '密码不对，再试一次';
    input.select();
  } finally {
    btn.disabled = false;
  }
});

if (location.protocol !== 'file:') trySavedKey();
